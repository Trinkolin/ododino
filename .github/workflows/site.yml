# Ododino : mise à jour hebdomadaire des données OSM et publication sur GitHub Pages.
#
# Sécurité :
# - les actions sont figées sur un commit précis (le numéro de version est en commentaire),
#   pour qu'une action piratée ne puisse pas modifier le site publié ; Dependabot propose les mises à jour ;
# - chaque job n'a que les droits dont il a besoin (seul « update » peut écrire dans le dépôt).
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi à 04:17 UTC
  workflow_dispatch:         # bouton « Run workflow » dans l'onglet Actions

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # enregistrer les nouvelles données
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Mettre à jour les données (OSM, sentiers, graphe du traceur)
        # Une seule commande, dans le bon ordre. Un jeu OSM ou le graphe en échec garde sa version
        # précédente ; si les sentiers échouent, le job échoue et rien n'est publié.
        run: python tools/update_data.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données OSM du $(date +%F)"
            git push
          fi

  build:
    needs: update
    # tourne aussi quand « update » est ignoré (push) ; pas s'il a échoué
    if: always() && needs.update.result != 'failure' && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}   # inclut les données que « update » vient d'enregistrer
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tests (mêmes cas pour Python et JavaScript)
        run: |
          python -m unittest discover -s tests
          node --test

      - name: Installer l'app (Angular)
        working-directory: web
        run: npm ci

      - name: Tests de l'app
        working-directory: web
        # prepare.mjs : traductions, fiches et pack hors ligne générés avant les tests
        run: |
          npm run prepare_assets
          npx ng test --watch=false

      - name: Construire le site (pré-rendu, adresse /ododino/)
        working-directory: web
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist/ododino/browser

  deploy:
    needs: build
    # sans always(), le saut de « update » (push) se propagerait et bloquerait la publication
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
