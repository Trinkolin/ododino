<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ododino</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <article class="about">
    <header class="brand">
      <div>
        <h1><a href="index.html" data-keep-lang>Ododino</a></h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div id="langs" class="langs" role="group"></div>
    </header>
    <p><a href="index.html" data-keep-lang data-i18n="back"></a></p>
    <div id="content"></div>
  </article>

  <script src="i18n.js"></script>
  <script>
    (() => {
      const I = window.I18N;
      let lang = I.detect();
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      function render() {
        const T = I[lang];
        document.documentElement.lang = lang;
        document.title = `${T.about} · Ododino`;
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[el.dataset.i18n]; });
        document.querySelectorAll('a[data-keep-lang]').forEach((a) => { a.href = 'index.html?lang=' + lang; });
        const mail = `<a href="mailto:${I.CONTACT}">${esc(I.CONTACT)}</a>`;
        document.getElementById('content').innerHTML = `<h1 class="title">${esc(T.about)}</h1>` + T.aboutHtml.replace('{contact}', mail);
        document.getElementById('langs').innerHTML = I.LANGS.map(([c, short, name]) =>
          `<button data-lang="${c}" class="${c === lang ? 'on' : ''}" title="${name}" lang="${c}" aria-pressed="${c === lang}">${short}</button>`).join('');
      }
      document.getElementById('langs').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-lang]'); if (!b) return;
        lang = b.dataset.lang; I.remember(lang);
        history.replaceState(null, '', '?lang=' + lang);
        render();
      });
      render();
    })();
  </script>
  <script data-goatcounter="https://ododino.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
