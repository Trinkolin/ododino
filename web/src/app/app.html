<mat-toolbar>
  @if (map.handset()) {
    <button mat-icon-button (click)="togglePanel()" [attr.aria-label]="i18n.t('togglePanel')" [attr.aria-expanded]="map.panelOpen()">
      <mat-icon svgIcon="menu"></mat-icon>
    </button>
  }
  <a mat-button [routerLink]="['/', i18n.lang()]">
    <img src="icons/logo.svg" alt="" width="28" height="28" matButtonIcon /> Ododino
  </a>
  @if (!map.handset()) { <span class="mat-body-small">{{ i18n.t('subtitle') }}</span> }
  <span class="spacer"></span>

  @if (!install.installed() && (install.canPrompt() || install.isIos())) {
    <button mat-flat-button (click)="installApp()">
      <mat-icon svgIcon="install_desktop"></mat-icon> {{ i18n.t('install') }}
    </button>
  }

  <button mat-button [matMenuTriggerFor]="langMenu" [attr.aria-label]="i18n.t('language')" [matTooltip]="i18n.t('language')">
    <mat-icon svgIcon="translate"></mat-icon> {{ i18n.lang().toUpperCase() }}
  </button>
  <mat-menu #langMenu="matMenu">
    @for (l of i18n.langs; track l.code) {
      <button mat-menu-item (click)="switchTo(l.code)" [attr.lang]="l.code" [disabled]="l.code === i18n.lang()">{{ l.label }}</button>
    }
  </mat-menu>
</mat-toolbar>

<main class="page"><router-outlet /></main>
