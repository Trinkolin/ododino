<mat-toolbar class="top">
  <a class="brand" [routerLink]="['/', i18n.lang()]">
    <img src="icons/logo.svg" alt="" width="30" height="30" />
    <span class="name">Ododino</span>
  </a>
  <span class="sub">{{ i18n.t('subtitle') }}</span>
  <span class="spacer"></span>

  @if (!install.installed() && (install.canPrompt() || install.isIos())) {
    <button mat-flat-button class="install" (click)="installApp()">
      <odo-icon name="install_desktop" /> {{ i18n.t('install') }}
    </button>
  }

  <button mat-button [matMenuTriggerFor]="langMenu" [attr.aria-label]="i18n.t('language')" [matTooltip]="i18n.t('language')">
    <odo-icon name="translate" /> {{ i18n.lang().toUpperCase() }}
  </button>
  <mat-menu #langMenu="matMenu">
    @for (l of i18n.langs; track l.code) {
      <button mat-menu-item (click)="switchTo(l.code)" [attr.lang]="l.code" [class.on]="l.code === i18n.lang()">{{ l.label }}</button>
    }
  </mat-menu>
</mat-toolbar>

<main class="page"><router-outlet /></main>
